# @package _global_
defaults:
  - /experiments/base/runtime: default
  - /experiments/base/schedule: 20e
  - /experiments/base/dataset: panobench_carlaocc
  - /experiments/base/model: sparseocc
  - _self_

data:
  occ_variant: ???
  load_instances: true
  train_bs: 1

val_evaluator:
  metrics:
    - type: PanoBenchOccMetric
      dataset_type: ${data.occ_dataset_type}
      occ_variant: ${data.occ_variant}
      metrics:
        - iou
        - miou
        - pq
        - raypq
      use_mask: true

test_evaluator: ${val_evaluator}

